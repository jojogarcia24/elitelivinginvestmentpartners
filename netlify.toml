# Netlify configuration — static site.
#
# `publish = "."` served the repository itself, including the database schema,
# the Edge Function source and the internal README/TODO notes. The build script
# is an explicit allow-list of what this site serves; see scripts/netlify-build.sh.
[build]
  publish = "dist"
  command = "bash scripts/netlify-build.sh dist"

# Sensible security headers for a static marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long-cache static assets (fingerprint-free, so keep it modest).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
